bundle:
  name: insurance-policyholder-data-pipeline

workspace:
  host: https://dbc-e9011047-6093.cloud.databricks.com

resources:
  jobs:
    run_pipeline:
      name: insurance-policyholder-pipeline
      tasks:
        - task_key: run_pipeline
          spark_python_task:
            python_file: scripts/run_pipeline.py
            parameters:
              - "${workspace.file_path}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "5"

targets:
  dev:
    mode: development
    default: true